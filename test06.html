<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guess a Number</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #25304a;
      background:
        radial-gradient(circle at top left, #d9e8ff 0, transparent 38%),
        linear-gradient(135deg, #f5f7ff, #e9edff);
    }

    .game-card {
      width: min(100%, 440px);
      padding: 40px 32px;
      text-align: center;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(53, 70, 120, 0.16);
    }

    .eyebrow {
      margin: 0 0 10px;
      color: #6b74a3;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #3446a8;
      font-size: clamp(2rem, 8vw, 2.7rem);
      letter-spacing: 0.04em;
    }

    .description {
      margin: 12px 0 28px;
      color: #69728c;
      line-height: 1.6;
    }

    .guess-form {
      display: flex;
      gap: 10px;
    }

    input {
      min-width: 0;
      flex: 1;
      padding: 14px 16px;
      color: #25304a;
      font: inherit;
      font-size: 1rem;
      border: 2px solid #dfe4f5;
      border-radius: 12px;
      outline: none;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    input:focus {
      border-color: #6476e8;
      box-shadow: 0 0 0 4px rgba(100, 118, 232, 0.14);
    }

    button {
      padding: 14px 20px;
      color: #fff;
      font: inherit;
      font-weight: 700;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, #6678e8, #4d5fd0);
      box-shadow: 0 8px 18px rgba(77, 95, 208, 0.25);
      cursor: pointer;
      transition: transform 160ms ease, box-shadow 160ms ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 11px 22px rgba(77, 95, 208, 0.3);
    }

    button:active {
      transform: translateY(0);
    }

    button:focus-visible {
      outline: 3px solid #aeb8ff;
      outline-offset: 3px;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      min-height: 28px;
      margin: 20px 0 8px;
      color: #59627b;
      font-weight: 600;
    }

    .message.success {
      color: #16805a;
    }

    .message.error {
      color: #d34b54;
    }

    .attempts {
      margin: 0;
      color: #8991a8;
      font-size: 0.9rem;
    }

    .restart-button {
      margin-top: 24px;
      color: #4d5fd0;
      background: #eef0ff;
      box-shadow: none;
    }

    .restart-button:hover {
      background: #e4e8ff;
      box-shadow: none;
    }

    @media (max-width: 420px) {
      .game-card {
        padding: 32px 22px;
      }

      .guess-form {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="game-card">
    <p class="eyebrow">A little number game</p>
    <h1>Guess a Number</h1>
    <p class="description">I’m thinking of a number from 1 to 100. Can you guess it?</p>

    <form class="guess-form" id="guess-form">
      <input
        type="number"
        id="number"
        min="1"
        max="100"
        step="1"
        placeholder="Enter a number"
        aria-label="Your guess, from 1 to 100"
        required
      />
      <button type="submit" id="guess-button">Guess</button>
    </form>

    <p class="message" id="result" role="status" aria-live="polite">
      Enter a number to get started.
    </p>
    <p class="attempts" id="attempts">Attempts: 0</p>

    <button type="button" class="restart-button" id="restart-button">
      Play again
    </button>
  </main>

  <script>
    const form = document.querySelector("#guess-form");
    const input = document.querySelector("#number");
    const result = document.querySelector("#result");
    const attemptsDisplay = document.querySelector("#attempts");
    const guessButton = document.querySelector("#guess-button");
    const restartButton = document.querySelector("#restart-button");

    let answer;
    let attempts;

    function startGame() {
      answer = Math.floor(Math.random() * 100) + 1;
      attempts = 0;

      input.value = "";
      input.disabled = false;
      guessButton.disabled = false;
      result.textContent = "Enter a number to get started.";
      result.className = "message";
      attemptsDisplay.textContent = "Attempts: 0";
      input.focus();
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const guess = Number(input.value);

      if (!Number.isInteger(guess) || guess < 1 || guess > 100) {
        result.textContent = "Please enter a whole number from 1 to 100.";
        result.className = "message error";
        input.focus();
        return;
      }

      attempts += 1;
      attemptsDisplay.textContent = `Attempts: ${attempts}`;

      if (guess > answer) {
        result.textContent = "Too big! Try a smaller number.";
        result.className = "message";
      } else if (guess < answer) {
        result.textContent = "Too small! Try a bigger number.";
        result.className = "message";
      } else {
        result.textContent = `You got it! The answer was ${answer}.`;
        result.className = "message success";
        input.disabled = true;
        guessButton.disabled = true;
      }

      input.value = "";
      if (!input.disabled) input.focus();
    });

    restartButton.addEventListener("click", startGame);

    startGame();
  </script>
</body>
</html>
