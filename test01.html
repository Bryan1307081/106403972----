    <hr>
    <p>請輸入分數：</p>
    <input type="number" name="subjectscore" id="subjectScore" min="0" max="100">
    <button type="button" name="subjectscore" value="calculate" onclick="checkScore()">calculate</button>

    <script>
        function checkScore() {
            let score = document.getElementById("subjectScore").value;
            if (score == 100) {
                alert("A++");
            } else if (score >= 90) {
                alert("A");
            } else if (score >= 80) {
                alert("B+");
            } else if (score >= 70) {
                alert("B");
            } else if (score >= 60) {
                alert("C+");
            } else {
                alert("F");
            }
        }
    </script>
    <hr>
    <p>英文單字</p>
    <input type="text" name="word" id="word">
    <button type="button" value="翻譯" onclick="translateword()">翻譯</button>
    <script>
        function translateword() {
            let word = document.getElementById("word").value;
            let url = "https://api.mymemory.translated.net/get?q=" + word + "&langpair=en|zh-TW";
            fetch(url).then(response => response.json()).then(
                data => {
                    let result = data.responseData.translatedText;
                    alert(result);
                }
            )
