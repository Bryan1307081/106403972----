<!DOCTYPE html>
<html lang="zh-tw">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <style>
        body {
            background-color: #1e0331;
            margin: 0px;
        }

        .float {
            float: left;
        }

        #player {
            position: relative;
            width: 760px;
            margin: 20px auto;
        }

        #t1, #t2, #t3, #t4 {
            position: absolute;
            top: 130px;
            left: 180px;
            visibility: hidden;
        }
    </style>
</head>

<body>
    <div id="player">
        <div class="float" style="height:122px">
            <img src="images/1_01.jpg" alt="" onmouseout="note('t3', 'hidden')"
                onmouseover="note('t3', 'visible')">
        </div>
        <div class="float" style="height:122px">
            <img src="images/1_02.jpg" alt="">
        </div>
        <div class="float" style="width: 144px">
            <div style="height:235px">
                <img src="images/1_03.jpg" alt="">
            </div>
            <div style="height:154px">
                <img src="images/1_07.jpg" alt="" onmouseout="note('t1', 'hidden')" onmouseover="note('t1', 'visible')">
            </div>
        </div>
        <div class="float" style="height:337px">
            <img src="images/1_04.jpg" alt="">
        </div>
        <div class="float" style="height:337px"><img src="images/1_05.jpg" alt=""
                onmouseout="note('t2', 'hidden')"
                onmouseover="note('t2', 'visible')">
        </div>
        <div class="float" style="height:337px"><img src="images/1_06.jpg" alt=""></div>
        <div class="float" style="height:52px"><img src="images/1_08.jpg" alt=""></div>

        <div id="t1"><img src="images/1-1.gif" alt=""></div>
        <div id="t2"><img src="images/1-2.gif" alt=""></div>
        <div id="t3"><img src="images/1-3.gif" alt=""></div>
        <div id="t4"><img src="images/1-4.gif" alt=""></div>
    </div>
    <script>
        function note(id, status) {
            document.getElementById(id).style.visibility = status;
        }
    </script>
</body>

</html>
